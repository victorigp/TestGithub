name: Publicar Documentacion Tecnica (DocFX)

on:
  push:
    branches: [ "master" ]
    paths:
      - "docs/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Documentacion
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Git Bash y Tar en PATH (para empaquetado de Pages)
        shell: powershell
        run: |
          $gitPath = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $gitPath -Parent) -Parent
          "$gitRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$gitRoot\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restaurar herramientas locales (.NET Tools)
        run: dotnet tool restore

      - name: Ejecutar pruebas unitarias y recolectar cobertura (Coverlet)
        run: |
          dotnet test TestGithub.Test/TestGithub.Test.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Generar reporte de cobertura (ReportGenerator)
        run: |
          dotnet reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:docs/coverage" "-reporttypes:Html;HtmlSummary" "-title:TestGithub - Cobertura de Código"

      - name: Compilar sitio web con DocFX (incluyendo cobertura)
        run: dotnet docfx docs/docfx.json

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_site'

  deploy:
    name: Desplegar en GitHub Pages
    needs: build
    runs-on: [self-hosted, windows]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
