name: Publicar Documentacion Tecnica (DocFX)

on:
  push:
    branches: [ "master" ]
    paths:
      - "docs/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  workflow_run:
    workflows: ["Calidad y Seguridad (CodeQL + Roslyn)", "Pruebas E2E Android (Appium + Allure)"]
    types: [completed]
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Documentacion
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Git Bash y Tar en PATH (para empaquetado de Pages)
        shell: powershell
        run: |
          $gitPath = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $gitPath -Parent) -Parent
          "$gitRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$gitRoot\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Descargar reporte de cobertura generado por Quality (workflow_run)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Calidad y Seguridad (CodeQL + Roslyn)'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Reporte-Cobertura-TestGithub
          path: docs/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar reporte Allure generado por E2E (workflow_run)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Pruebas E2E Android (Appium + Allure)'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Reporte-Allure-TestGithub
          path: docs/allure-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar reportes previos (fallback para push o ejecucion manual)
        if: github.event_name != 'workflow_run'
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download --name Reporte-Cobertura-TestGithub --dir docs/coverage
          gh run download --name Reporte-Allure-TestGithub --dir docs/allure-report

      - name: Asegurar existencia de carpeta de cobertura para DocFX
        shell: powershell
        run: |
          if (-not (Test-Path "docs/coverage/index.html")) {
              New-Item -ItemType Directory -Path "docs/coverage" -Force | Out-Null
              Set-Content -Path "docs/coverage/index.html" -Value "<html><head><meta charset='utf-8'><title>Cobertura</title><style>body{font-family:sans-serif;text-align:center;padding:50px;color:#8b949e;background:#0d1117;}</style></head><body><h2>Reporte de Cobertura</h2><p>El reporte de cobertura se generará automáticamente en el próximo pase del flujo de Calidad y Pruebas.</p></body></html>" -Encoding utf8
          }

      - name: Asegurar existencia de carpeta Allure para DocFX
        shell: powershell
        run: |
          if (-not (Test-Path "docs/allure-report/index.html")) {
              New-Item -ItemType Directory -Path "docs/allure-report" -Force | Out-Null
              Set-Content -Path "docs/allure-report/index.html" -Value "<html><head><meta charset='utf-8'><title>Reporte Allure</title><style>body{font-family:sans-serif;text-align:center;padding:50px;color:#8b949e;background:#1e1e1e;}</style></head><body><h2>Reporte de Pruebas E2E (Allure)</h2><p>El reporte de pruebas E2E se generará automáticamente en el próximo pase del flujo de Pruebas E2E Android.</p></body></html>" -Encoding utf8
          }

      - name: Restaurar herramientas locales (.NET Tools)
        run: dotnet tool restore

      - name: Compilar sitio web con DocFX (incluyendo cobertura y Allure)
        run: dotnet docfx docs/docfx.json

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_site'

  deploy:
    name: Desplegar en GitHub Pages
    needs: build
    runs-on: [self-hosted, windows]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
