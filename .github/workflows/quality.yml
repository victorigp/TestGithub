name: Calidad y Seguridad (CodeQL + Roslyn)

on:
  push:
    branches: [ "develop", "release", "master" ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - ".github/workflows/docs.yml"

jobs:
  analyze:
    name: Compilacion y Analisis de Seguridad
    runs-on: [self-hosted, windows]
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inicializar CodeQL
        if: vars.ENABLE_CODEQL == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Compilar con Roslyn (SonarAnalyzer estricto) y generar SARIF
        run: dotnet build TestGithub.sln --configuration Release

      - name: Subir Alertas de Calidad Roslyn a GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('roslyn.sarif') != ''
        with:
          sarif_file: roslyn.sarif
          category: roslyn-quality

      - name: Restaurar herramientas locales (.NET Tools)
        run: dotnet tool restore

      - name: Ejecutar pruebas unitarias con Coverlet
        run: |
          dotnet test TestGithub.Test/TestGithub.Test.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "console;verbosity=normal"

      - name: Generar Reporte de Cobertura con ReportGenerator
        if: always() && hashFiles('TestResults/**/coverage.cobertura.xml') != ''
        shell: powershell
        run: |
          dotnet reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:TestResults/CoverageReport" "-reporttypes:Html;HtmlSummary;MarkdownSummaryGithub" "-title:TestGithub - Reporte de Cobertura"
          if (Test-Path "TestResults/CoverageReport/SummaryGithub.md") {
              Get-Content "TestResults/CoverageReport/SummaryGithub.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Subir Reporte de Cobertura como Artefacto
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('TestResults/CoverageReport/**') != ''
        with:
          name: Reporte-Cobertura-TestGithub
          path: TestResults/CoverageReport

      - name: Ejecutar Analisis CodeQL
        if: vars.ENABLE_CODEQL == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          output: "../results"

      - name: Comprobar Alertas de Seguridad CodeQL (Falla si hay vulnerabilidades)
        if: vars.ENABLE_CODEQL == 'true'
        shell: powershell
        run: |
          $sarifFile = Resolve-Path "../results/csharp.sarif" -ErrorAction SilentlyContinue
          if ($sarifFile -and (Test-Path $sarifFile)) {
              $sarif = Get-Content $sarifFile -Raw | ConvertFrom-Json
              $alerts = @()
              foreach ($run in $sarif.runs) {
                  if ($run.results) {
                      $alerts += $run.results
                  }
              }
              if ($alerts.Count -gt 0) {
                  Write-Host "::error::CodeQL ha detectado $($alerts.Count) vulnerabilidad(es) de seguridad en el codigo."
                  foreach ($alert in $alerts) {
                      Write-Host "- [Regla: $($alert.ruleId)] $($alert.message.text)"
                  }
                  exit 1
              } else {
                  Write-Host "CodeQL: No se detectaron vulnerabilidades de seguridad."
              }
          }
