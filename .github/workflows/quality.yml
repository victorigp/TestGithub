name: Calidad y Seguridad (CodeQL + Roslyn)

on:
  push:
    branches: [ "develop", "release", "master" ]

jobs:
  analyze:
    name: Compilación y Análisis de Seguridad
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.315' # Igual que global.json

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Compilar con Roslyn (SonarAnalyzer estricto)
        run: dotnet build SIGAPEA_RF.sln --configuration Release

      - name: Ejecutar Análisis CodeQL
        if: always() # Sube los resultados de CodeQL aunque la compilación falle
        uses: github/codeql-action/analyze@v3